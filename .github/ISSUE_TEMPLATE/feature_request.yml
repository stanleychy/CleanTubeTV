name: Feature request
description: Suggest a new function or a change.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project keeps the app small and the supply chain short.
        A request that adds a new library, analytics or remote code will probably be rejected.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the function. Tell how it works with the TV remote.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions that you examined.
  - type: dropdown
    id: dependency
    attributes:
      label: Does this need a new dependency?
      options:
        - "No"
        - "Yes (write the name and the reason below)"
        - I do not know
    validations:
      required: true
